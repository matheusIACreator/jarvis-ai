[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Personal voice assistant (Iron Man style), native on Windows 11."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
