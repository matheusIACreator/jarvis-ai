[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Personal voice assistant (Iron Man style), native on Windows 11."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    # PyAV 19.0.2's bitstream wheel is blocked by App Control on the Windows laptop.
    "av==18.0.0; sys_platform == 'win32'",
    "elevenlabs>=2",
    "faster-whisper>=1.2",
    "numpy>=2",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
